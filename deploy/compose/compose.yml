name: agent-campus

services:
  api:
    image: ${CAMPUS_API_IMAGE:-ghcr.io/sodawave/agent-campus-api:main}
    env_file:
      - .env
    environment:
      CAMPUS_BIND_ADDR: 0.0.0.0:3000
      CAMPUS_HEALTH_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-campus}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-campus}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      CAMPUS_S3_ENDPOINT: http://minio:9000
      CAMPUS_S3_ADDRESSING_STYLE: path
      CAMPUS_S3_ACCESS_KEY: ${CAMPUS_S3_ACCESS_KEY:?set CAMPUS_S3_ACCESS_KEY}
      CAMPUS_S3_SECRET_KEY: ${CAMPUS_S3_SECRET_KEY:?set CAMPUS_S3_SECRET_KEY}
      CAMPUS_S3_BUCKET: ${CAMPUS_S3_BUCKET:-campus-library}
      # internal | buzz — agent/human event bus
      CAMPUS_COMMS_BACKEND: ${CAMPUS_COMMS_BACKEND:-internal}
      CAMPUS_BUZZ_RELAY_URL: ${CAMPUS_BUZZ_RELAY_URL:-}
      MEMPALACE_URL: ${MEMPALACE_URL:-http://mempalace:8080}
    ports:
      - "${CAMPUS_HTTP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /healthz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - campus-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus}
      POSTGRES_USER: ${POSTGRES_USER:-campus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - campus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - campus-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - campus-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - campus-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CAMPUS_S3_ACCESS_KEY:?set CAMPUS_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${CAMPUS_S3_SECRET_KEY:?set CAMPUS_S3_SECRET_KEY}
    volumes:
      - campus-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - campus-net

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      CAMPUS_S3_ACCESS_KEY: ${CAMPUS_S3_ACCESS_KEY:?set CAMPUS_S3_ACCESS_KEY}
      CAMPUS_S3_SECRET_KEY: ${CAMPUS_S3_SECRET_KEY:?set CAMPUS_S3_SECRET_KEY}
      CAMPUS_S3_BUCKET: ${CAMPUS_S3_BUCKET:-campus-library}
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://minio:9000 "$${CAMPUS_S3_ACCESS_KEY}" "$${CAMPUS_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${CAMPUS_S3_BUCKET}"
        mc anonymous set none "local/$${CAMPUS_S3_BUCKET}"
      '
    restart: "no"
    networks:
      - campus-net

  # Optional — enable with CAMPUS_COMPOSE_MEMPALACE=true (compose.mempalace.yml later)
  # mempalace:
  #   image: ghcr.io/mempalace/mempalace:latest
  #   ...

volumes:
  campus-postgres-data:
  campus-redis-data:
  campus-minio-data:

networks:
  campus-net:
    driver: bridge
